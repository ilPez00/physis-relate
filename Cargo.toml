[package]
name = "physis-relate"
version = "0.1.0"
edition = "2024"

# The `relate` crate is not imported directly: this binary drives the installed
# `relate` CLI for every graph operation, so the dependency is unused code.
[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.8"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.10"
which = "8.0.6"
